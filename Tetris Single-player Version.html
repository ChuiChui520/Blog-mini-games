<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄罗斯方块（单机版）</title><style>*{box-sizing:border-box}body{margin:0;background:#0f141b;color:#eaeef3;font-family:System-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Microsoft YaHei"}header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0b0e12;border-bottom:1px solid #1e2430}main{max-width:980px;margin:20px auto;padding:0 14px}section{background:#101620;border:1px solid #1e2430;border-radius:8px;padding:12px} .row{display:flex;gap:14px}.left{flex:1}.right{width:220px}.panel{border:1px solid #1e2430;border-radius:8px;padding:10px}.space{height:10px}button{background:#182132;border:1px solid #33425a;color:#eaeef3;padding:8px 10px;border-radius:6px;cursor:pointer}button.start{background:#2ed573;border-color:#2ed573}canvas{background:#0b0e12;border:1px solid #1e2430;border-radius:6px}#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}#ov .box{background:#0f141b;border:1px solid #1e2430;border-radius:8px;padding:16px;text-align:center;width:260px}</style></head><body><header><h1>俄罗斯方块（单机版）</h1><div>打开即玩，无需登录</div></header><main><section><div class="row"><div class="left"><canvas id="cv" width="300" height="600"></canvas><div style="display:flex;gap:8px;justify-content:center;margin-top:8px"><button id="bL">← 左移</button><button id="bR">→ 右移</button><button id="bU">⟳ 旋转</button><button id="bD">↓ 加速下落</button></div></div><div class="right"><div class="panel"><div>得分：<span id="sc">0</span></div><div class="space"></div><div>下一个：</div><canvas id="cvn" width="120" height="120"></canvas><div class="space"></div><button id="start" class="start">开始游戏</button></div></div></div><div id="ov"><div class="box"><h3>游戏结束</h3><p>最终得分：<span id="fs">0</span></p></div></div></section></main><script>(function(){const COLS=10,ROWS=20,SIZE=30;const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const cvn=document.getElementById('cvn'),nx=cvn.getContext('2d');const sc=document.getElementById('sc'),fs=document.getElementById('fs'),ov=document.getElementById('ov');const bL=document.getElementById('bL'),bR=document.getElementById('bR'),bU=document.getElementById('bU'),bD=document.getElementById('bD'),start=document.getElementById('start');let board,cur,next,x=3,y=-1,score=0,running=false,drop=520,timer=null;const COLORS={I:'#2a7ade',J:'#4c78d4',L:'#ffa62b',O:'#ffd166',S:'#2ed573',Z:'#ff6b6b',T:'#c77dff'};const PIECES={I:[[1,1,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]],O:[[1,1],[1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],T:[[0,1,0],[1,1,1]]};function empty(){return Array.from({length:ROWS},()=>Array(COLS).fill(0))}function randPiece(){const ks=Object.keys(PIECES);const k=ks[Math.floor(Math.random()*ks.length)];return {k,m:PIECES[k].map(r=>r.slice())}}function rot(m){const h=m.length,w=m[0].length,res=Array.from({length:w},()=>Array(h).fill(0));for(let i=0;i<h;i++)for(let j=0;j<w;j++)res[j][h-1-i]=m[i][j];return res}function collide(nx=x,ny=y,nm=cur.m){for(let i=0;i<nm.length;i++)for(let j=0;j<nm[0].length;j++){if(!nm[i][j])continue;const yy=ny+i,xx=nx+j;if(xx<0||xx>=COLS||yy>=ROWS)return true;if(yy>=0&&board[yy][xx])return true}return false}function merge(){for(let i=0;i<cur.m.length;i++)for(let j=0;j<cur.m[0].length;j++)if(cur.m[i][j]&&y+i>=0)board[y+i][x+j]=cur.k}function clearLines(){let c=0;for(let r=ROWS-1;r>=0;r--){if(board[r].every(v=>v)){board.splice(r,1);board.unshift(Array(COLS).fill(0));c++;r++}}if(c>0){const pts=[0,100,300,500,800];score+=pts[c];sc.textContent=score}}function draw(){ctx.clearRect(0,0,COLS*SIZE,ROWS*SIZE);for(let r=0;r<ROWS;r++){for(let c=0;c<COLS;c++){const k=board[r][c];if(k){ctx.fillStyle=COLORS[k];ctx.fillRect(c*SIZE,r*SIZE,SIZE-1,SIZE-1)}}}ctx.fillStyle=COLORS[cur.k];for(let i=0;i<cur.m.length;i++)for(let j=0;j<cur.m[0].length;j++)if(cur.m[i][j]){const yy=y+i,xx=x+j;if(yy>=0){ctx.fillRect(xx*SIZE,yy*SIZE,SIZE-1,SIZE-1)}}}function drawNext(){nx.clearRect(0,0,120,120);nx.fillStyle=COLORS[next.k];const m=next.m,h=m.length,w=m[0].length;const offX=Math.floor((4-w)/2),offY=Math.floor((4-h)/2);for(let i=0;i<h;i++)for(let j=0;j<w;j++)if(m[i][j])nx.fillRect((offX+j)*24,(offY+i)*24,22,22)}function spawn(){cur=next||randPiece();next=randPiece();x=Math.floor((COLS-cur.m[0].length)/2);y=-1;drawNext();if(collide(x,y+1,cur.m)){over();return}}function step(){if(!running)return;if(!collide(x,y+1)){y++}else{if(y<0){over();return}merge();clearLines();spawn()}draw()}function tryMove(dx){if(!collide(x+dx,y)){x+=dx;draw()}}function tryRotate(){const m2=rot(cur.m);if(!collide(x,y,m2)){cur.m=m2;draw()}}function soft(){if(!collide(x,y+1)){y++;draw()}else{if(y<0){over();return}merge();clearLines();spawn();draw()}}function startGame(){board=empty();score=0;sc.textContent='0';running=true;ov.style.display='none';cur=null;next=randPiece();spawn();draw();if(timer)clearInterval(timer);timer=setInterval(step,drop)}function over(){running=false;clearInterval(timer);timer=null;fs.textContent=score;ov.style.display='flex';setTimeout(()=>{ov.style.display='none'},1200)}start.addEventListener('click',startGame);bL.addEventListener('click',()=>tryMove(-1));bR.addEventListener('click',()=>tryMove(1));bU.addEventListener('click',()=>tryRotate());bD.addEventListener('mousedown',()=>{if(running){if(timer)clearInterval(timer);timer=setInterval(step,60)}});bD.addEventListener('mouseup',()=>{if(running){if(timer)clearInterval(timer);timer=setInterval(step,drop)}});window.addEventListener('keydown',e=>{if(!running)return;if(e.key==='ArrowLeft')tryMove(-1);else if(e.key==='ArrowRight')tryMove(1);else if(e.key==='ArrowUp')tryRotate();else if(e.key==='ArrowDown')soft()});})();</script></body></html>
