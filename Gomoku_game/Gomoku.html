<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        /* 背景装饰元素 */
        .background-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
        }
        
        .bg-circle-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }
        
        .bg-circle-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -50px;
        }
        
        .bg-circle-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        }
        #renderer {
            width: 100%;
            height: 100%;
        }
        #game-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(245, 245, 245, 0.8));
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #status {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #45a049;
        }
        #resetBtn {
            background-color: #f44336;
        }
        #resetBtn:hover {
            background-color: #d32f2f;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(245, 245, 245, 0.8));
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 200px;
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #instructions h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        #instructions p {
            font-size: 14px;
            line-height: 1.5;
        }
        /* 主界面样式 */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            overflow: hidden;
        }
        
        /* 主菜单装饰元素 */
        .menu-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .menu-pattern {
            position: absolute;
            opacity: 0.1;
        }
        
        .menu-pattern-1 {
            top: 10%;
            left: 10%;
            width: 200px;
            height: 200px;
            border: 2px solid white;
            transform: rotate(45deg);
        }
        
        .menu-pattern-2 {
            bottom: 10%;
            right: 10%;
            width: 150px;
            height: 150px;
            border: 2px solid white;
            border-radius: 50%;
        }
        
        .menu-pattern-3 {
            top: 40%;
            right: 15%;
            width: 100px;
            height: 100px;
            border: 2px solid white;
            transform: rotate(30deg);
        }
        #main-menu h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 60px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #667eea, 0 0 40px #667eea;
            }
            to {
                text-shadow: 0 0 20px #fff, 0 0 30px #764ba2, 0 0 40px #764ba2, 0 0 50px #764ba2;
            }
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .menu-button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .menu-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.6s ease;
        }
        
        .menu-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }
        
        .menu-button:hover::before {
            left: 100%;
        }
        
        #singlePlayerBtn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        
        #multiPlayerBtn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        
        #multiPlayerBtn:hover {
            background: linear-gradient(135deg, #27ae60, #229954);
        }
    </style>
</head>
<body>
    <div id="main-menu">
        <div class="menu-decoration">
            <div class="menu-pattern menu-pattern-1"></div>
            <div class="menu-pattern menu-pattern-2"></div>
            <div class="menu-pattern menu-pattern-3"></div>
        </div>
        <h1>3D五子棋</h1>
        <div class="menu-buttons">
            <button id="singlePlayerBtn" class="menu-button">单人游戏</button>
            <button id="multiPlayerBtn" class="menu-button">多人游戏</button>
        </div>
    </div>
    
    <!-- 背景装饰 -->
    <div class="background-decoration">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>
    </div>
    
    <div id="game-container">
        <canvas id="renderer"></canvas>
        <div id="game-info">
            <div id="status">轮到黑棋</div>
            <div id="gameMode"></div>
            <div class="controls">
                <button id="resetBtn">重新开始</button>
                <button id="rotateBtn">旋转视角</button>
                <button id="backToMenuBtn">返回菜单</button>
            </div>
        </div>
        <div id="instructions">
            <h3>游戏说明</h3>
            <p>点击棋盘放置棋子，先连成五子者获胜。黑棋先行。</p>
        </div>
    </div>

    <!-- 引入 Three.js 库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="Gomoku_game_main.js"></script>
</body>
</html>
